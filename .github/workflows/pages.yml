# Temporary review deployment to GitHub Pages at https://prucnal-sachdev.github.io/The-Spa-and-Studio-at-MDS/
# Production hosting is Netlify (see netlify.toml); this workflow only exists so the
# site can be previewed at a public URL before the client has bought anything. The
# build is marked noindex so a preview never competes with the client's real site.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # .npmrc pins npm's script shell to Git Bash on Windows; override on Linux.
  npm_config_script_shell: /bin/bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # enablement:true turns Pages on for a brand-new repo, so the first push
      # deploys without anyone visiting the Settings screen.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://prucnal-sachdev.github.io
          BASE_PATH: /The-Spa-and-Studio-at-MDS
          PUBLIC_NOINDEX: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
